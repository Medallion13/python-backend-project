[tool.poetry]
name = "python-backend-project"
version = "0.1.0"
description = "Proyecto de practica sobre arquitectura"
authors = [
    "Medallion13 <nickcar13@gmail.com>"
]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
sqlalchemy = "^2.0.44"
psycopg = {extras = ["binary"], version = "^3.2.12"}
alembic = "^1.17.1"
pydantic-settings = "^2.11.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.25.0"  # Para tests de FastAPI
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.0"
python-multipart = "^0.0.20"


#------- tool configurations -------#
[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
  | __pycache__
  | venv
  | .venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # ← AGREGAR: pep8-naming (convenciones de nombres)
    "W",   # ← AGREGAR: warnings
    "B",   # ← AGREGAR: flake8-bugbear (detecta bugs comunes)
]
ignore = ["E501"]  # Ignora "líneas demasiado largas" (Black se encarga)

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
"""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore:Please use `import python_multipart` instead:PendingDeprecationWarning"
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "build", "dist", "__pycache__", "migrations", ".git"]

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "pydantic.*",
    "sqlalchemy.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
